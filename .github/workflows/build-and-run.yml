name: Build and Run Examples

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-framework:
    name: Framework (net462)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore Examples/GroupDocs.Viewer.Examples.CSharp.Framework/GroupDocs.Viewer.Examples.CSharp.Framework.csproj

      - name: Build
        run: dotnet build Examples/GroupDocs.Viewer.Examples.CSharp.Framework/GroupDocs.Viewer.Examples.CSharp.Framework.csproj --no-restore --configuration Release

      - name: Run examples
        run: dotnet run --project Examples/GroupDocs.Viewer.Examples.CSharp.Framework/GroupDocs.Viewer.Examples.CSharp.Framework.csproj --configuration Release --no-build

  build-net:
    name: Net (net10.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore Examples/GroupDocs.Viewer.Examples.CSharp.Net/GroupDocs.Viewer.Examples.CSharp.Net.csproj

      - name: Build
        run: dotnet build Examples/GroupDocs.Viewer.Examples.CSharp.Net/GroupDocs.Viewer.Examples.CSharp.Net.csproj --no-restore --configuration Release

      - name: Run examples
        run: dotnet run --project Examples/GroupDocs.Viewer.Examples.CSharp.Net/GroupDocs.Viewer.Examples.CSharp.Net.csproj --configuration Release --no-build

  build-netwindows:
    name: NetWindows (net10.0-windows7.0)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore Examples/GroupDocs.Viewer.Examples.CSharp.NetWindows/GroupDocs.Viewer.Examples.CSharp.NetWindows.csproj

      - name: Build
        run: dotnet build Examples/GroupDocs.Viewer.Examples.CSharp.NetWindows/GroupDocs.Viewer.Examples.CSharp.NetWindows.csproj --no-restore --configuration Release

      - name: Run examples
        run: dotnet run --project Examples/GroupDocs.Viewer.Examples.CSharp.NetWindows/GroupDocs.Viewer.Examples.CSharp.NetWindows.csproj --configuration Release --no-build
